<title>Event Blueprint</title>
<!-- EA-SYS: fonts self-hosted (public/blueprint-fonts/): the dashboard's own Geist and Geist Mono, never Google -->
<link rel="stylesheet" href="/blueprint-fonts/fonts.css">
<style>
/* EA-SYS: restyled Oct 8, 2026 to match the EA-SYS dashboard (owner's choice of two directions):
   its cerulean, Geist type, white cards with soft corners. Layout: a guided studio. Phone: a
   section picker on top, one section at a time, sticky Back/Next. Desktop (>=980px): the
   sections grouped in four phases on the left, the section in the centre, "what is left" on
   the right. Colour rule: the accent is for actions and the current place; amber and red are
   kept for things that need attention, never for "not started yet". */
:root {
  --bg: #f9fbfc; --surface: #ffffff; --surface-2: #f3f7f9; --ink: #1b2a33; --ink-2: #44545e; --muted: #677884;
  --line: #dbe5ea; --line-2: #c5d3db; --accent: #007fa8; --accent-ink: #ffffff; --accent-text: #007da6; --accent-soft: #e5f6fc;
  --ok: #16794a; --ok-soft: #e3f3ea; --warn: #8f5a06; --warn-soft: #fcf1de; --bad: #b42318; --bad-soft: #fbe7e5; --focus: #00a3d6;
  --shadow: 0 1px 2px rgba(15, 40, 55, .05); --shadow-lg: 0 12px 40px rgba(15, 40, 55, .16);
  --r: 12px; --r-sm: 8px;
  --f-display: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1a20; --surface: #15232b; --surface-2: #1c2c35; --ink: #e6eef2; --ink-2: #c0cdd4; --muted: #94a6b1;
  --line: #263843; --line-2: #344a56; --accent: #1db6e6; --accent-ink: #04151d; --accent-text: #5ccdf1; --accent-soft: #133443;
  --ok: #5cc690; --ok-soft: #12301f; --warn: #e6ac4f; --warn-soft: #33270f; --bad: #f2867b; --bad-soft: #3a1915; --focus: #5ccdf1;
  --shadow: 0 1px 2px rgba(0, 0, 0, .25); --shadow-lg: 0 12px 40px rgba(0, 0, 0, .45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1a20; --surface: #15232b; --surface-2: #1c2c35; --ink: #e6eef2; --ink-2: #c0cdd4; --muted: #94a6b1;
  --line: #263843; --line-2: #344a56; --accent: #1db6e6; --accent-ink: #04151d; --accent-text: #5ccdf1; --accent-soft: #133443;
  --ok: #5cc690; --ok-soft: #12301f; --warn: #e6ac4f; --warn-soft: #33270f; --bad: #f2867b; --bad-soft: #3a1915; --focus: #5ccdf1;
  --shadow: 0 1px 2px rgba(0, 0, 0, .25); --shadow-lg: 0 12px 40px rgba(0, 0, 0, .45); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -.015em; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 980px) { .wrap { padding-inline: 28px; } }
.eyebrow { font: 600 12px/1.2 var(--f-body); letter-spacing: .02em; color: var(--muted); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* buttons: one primary per screen, the rest outlined or plain */
.primary, .secondary, .ghostbtn, .tpl, .assist { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r-sm); font-weight: 500; font-size: 14px; min-height: 40px; padding: 8px 16px; border: 1px solid transparent; box-shadow: var(--shadow); transition: background-color .15s, border-color .15s, filter .15s; }
.primary, .assist { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.primary:hover, .assist:hover { filter: brightness(1.08); }
.secondary, .ghostbtn, .tpl { background: var(--surface); border-color: var(--line); color: var(--ink); }
.secondary:hover, .ghostbtn:hover, .tpl:hover { background: var(--surface-2); border-color: var(--line-2); }
.ghostbtn { font-size: 13.5px; }
.assist:disabled, .primary:disabled { opacity: .6; cursor: progress; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.mark { width: 30px; height: 30px; flex: none; border-radius: var(--r-sm); background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 15px/1 var(--f-body); }
.crumb { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand .t { font: 600 15px/1.2 var(--f-body); white-space: nowrap; }
.brand .s { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brand .s::before { content: "/"; margin-right: 8px; color: var(--line-2); }
.ring { display: none !important; }
@media (max-width: 600px) { .brand .t { display: none; } .brand .s::before { display: none; } }

/* phone: the section picker */
.steps { max-width: 1280px; margin: 0 auto; padding: 0 16px 12px; display: grid; gap: 8px; }
.secpick { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 14px; min-height: 52px; box-shadow: var(--shadow); }
.secpick .pk1 { display: block; font-size: 12px; color: var(--muted); }
.secpick .pk2 { display: block; font-weight: 600; font-size: 15px; }
.secpick .chev { flex: none; color: var(--muted); transition: transform .15s; }
.secpick[aria-expanded="true"] .chev { transform: rotate(180deg); }
.steplist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 8px; display: grid; gap: 14px; max-height: 64vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
.slim { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.slim i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

/* the section list (rail on desktop, picker list on phone): grouped, each with a state mark */
.rgroup { display: grid; gap: 1px; }
.rgl { font: 600 11px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 10px 6px; }
.rail button, .step { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: var(--r-sm); padding: 7px 10px; font-size: 14px; color: var(--ink); min-height: 40px; }
.rail button:hover, .step:hover { background: var(--surface-2); }
.rail button[aria-current="step"], .step[aria-current="step"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.sm8 { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.dot { width: 16px; height: 16px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 1.5px solid var(--line-2); background: var(--surface); font: 700 9px/1 var(--f-body); color: var(--accent-ink); }
.dot.g { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.dot.g::after { content: "✓"; }
.dot.a { border-color: var(--accent); background: conic-gradient(var(--accent) 0 50%, transparent 50% 100%); }
.dot.r { border-color: var(--line-2); }
.dot.cur { border: 5px solid var(--accent); background: var(--surface); }
.dot.cur::after { content: none; }
.rmeta { font-size: 11.5px; white-space: nowrap; color: var(--muted); }
.rmeta.need { color: var(--warn); background: var(--warn-soft); padding: 1px 7px; border-radius: 99px; font-weight: 500; }
.rmeta.chg { color: var(--accent-text); background: var(--accent-soft); padding: 1px 7px; border-radius: 99px; font-weight: 500; }
.rr { display: inline-flex; gap: 6px; align-items: center; }

/* layout */
.layout { display: grid; grid-template-columns: 1fr; gap: 24px; padding-block: 16px 120px; }
.rail, .side { display: none; }
@media (min-width: 980px) {
  .steps { display: none; }
  .layout { grid-template-columns: 228px minmax(0, 1fr) 300px; align-items: start; padding-top: 24px; }
  .rail { display: grid; gap: 16px; position: sticky; top: 80px; max-height: calc(100vh - 170px); overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
  .rail button { min-height: 36px; padding-block: 6px; }
  .side { display: block; position: sticky; top: 80px; max-height: calc(100vh - 170px); overflow-y: auto; overscroll-behavior: contain; }
}
main { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 18px 24px; box-shadow: var(--shadow); }
@media (min-width: 640px) { .panel { padding: 28px 30px 32px; } }
.phead { display: grid; gap: 6px; margin-bottom: 26px; }
.phead h2 { font-size: clamp(24px, 4vw, 28px); line-height: 1.15; }
@media (max-width: 979px) { .phead > .eyebrow { display: none; } } /* the section picker already says where you are */
.phead p { margin: 0; color: var(--ink-2); max-width: 64ch; }
.ptools { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.fields { display: grid; gap: 26px; }
.fields > div:empty { display: none; } /* placeholders a later render fills (tools, notes, live checks) must not add gaps */
.f { display: grid; gap: 8px; min-width: 0; }
.f > label, .f .lab { font-weight: 600; font-size: 14.5px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.req { font: 400 13px var(--f-body); color: var(--muted); }
.req::before { content: "("; } .req::after { content: ")"; }
.req.need { font-weight: 500; font-size: 12px; color: var(--accent-text); }
.req.need::before, .req.need::after { content: none; }
.help { font-size: 13px; color: var(--muted); margin-top: -4px; max-width: 64ch; }
.two { display: grid; gap: 22px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .two { grid-template-columns: 1fr 1fr; } }
input[type=text], input[type=url], input[type=date], input[type=number], input[type=email], textarea, select {
  width: 100%; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 12px; font-size: 16px; min-height: 44px; box-shadow: var(--shadow); }
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
::placeholder { color: var(--muted); opacity: .85; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 99px; padding: 7px 14px; font-size: 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 7px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.chip[aria-pressed="true"]::before { content: "✓"; font-size: 12px; }

/* cards: paths and types */
.cards { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .cards.c3 { grid-template-columns: repeat(3, 1fr); } .cards.c2 { grid-template-columns: repeat(2, 1fr); } }
.card { text-align: left; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px; display: grid; gap: 6px; align-content: start; min-width: 0; box-shadow: var(--shadow); position: relative; transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--accent); }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }
.card[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 12px; right: 12px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.card .ct { font: 600 16px/1.3 var(--f-body); padding-right: 22px; }
.card .cd { font-size: 13.5px; color: var(--ink-2); }
.card .ck { font: 500 12px var(--f-body); color: var(--muted); }
.types { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.type { text-align: left; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 11px 12px; display: grid; gap: 3px; min-height: 76px; align-content: start; transition: border-color .15s; }
.type:hover { border-color: var(--accent); }
.type[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }
.type .tn { font-weight: 600; font-size: 14px; line-height: 1.3; }
.type[aria-pressed="true"] .tn { color: var(--accent-text); }
.type .te { font-size: 12.5px; color: var(--muted); line-height: 1.35; }

/* row editors */
.rows { display: grid; gap: 8px; }
.row { display: grid; gap: 8px; grid-template-columns: var(--cols); align-items: start; }
.row input, .row select { min-height: 40px; padding: 8px 10px; font-size: 15px; }
.rowhead { display: grid; gap: 8px; grid-template-columns: var(--cols); font: 500 12px var(--f-body); color: var(--muted); }
.del { min-height: 40px; width: 40px; background: transparent; border: 1px solid transparent; border-radius: var(--r-sm); font-size: 18px; color: var(--muted); }
.del:hover { color: var(--bad); background: var(--bad-soft); }
@media (max-width: 639px) {
  .row { grid-template-columns: 1fr 40px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); }
  .row > *:not(.del) { grid-column: 1; }
  .row .del { grid-column: 2; grid-row: 1; }
  .rowhead { display: none; }
  .row [data-ph]::placeholder { opacity: 1; }
}
.addrow { justify-self: start; background: transparent; border: 1px dashed var(--line-2); border-radius: var(--r-sm); color: var(--accent-text); padding: 8px 14px; font-weight: 500; font-size: 14px; min-height: 40px; }
.addrow:hover { border-color: var(--accent); background: var(--accent-soft); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.note { font-size: 13px; color: var(--muted); }
.note.err { color: var(--bad); }
.sumline { font: 500 12.5px var(--f-body); color: var(--muted); }

/* concept studio */
.studio { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); padding: 16px; display: grid; gap: 12px; }
.studio h3 { font-size: 18px; }
.concepts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.concept { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px; display: grid; gap: 8px; align-content: start; box-shadow: var(--shadow); }
.concept[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.concept .cn { font: 600 18px/1.25 var(--f-body); }
.concept p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.concept .lbl { font: 600 11.5px var(--f-body); color: var(--muted); margin-top: 4px; }
.concept .use { justify-self: start; margin-top: 6px; }
.skeleton { height: 150px; border-radius: var(--r); background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: sh 1.4s infinite; border: 1px solid var(--line); }
@keyframes sh { to { background-position: -200% 0; } }

/* the side panel: what is left before submitting */
.ready { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; box-shadow: var(--shadow); font-size: 13.5px; }
.ready .rh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ready .big { font: 600 26px/1 var(--f-body); letter-spacing: -.02em; }
.ready .big small { font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.secstat { display: grid; gap: 0; font-size: 13px; }
.secstat button { min-height: 40px; }
.secstat div { display: flex; align-items: center; gap: 8px; }
.missing { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.missing li { display: flex; gap: 8px; font-size: 13.5px; align-items: center; justify-content: space-between; border-radius: var(--r-sm); }
.missing li:hover { background: var(--surface-2); }
.missing .in { font-size: 12px; color: var(--muted); white-space: nowrap; padding-right: 8px; }
.missing .tag { font: 600 11px var(--f-body); padding: 2px 8px; flex: none; border-radius: 99px; }
.tag { font: 600 11px var(--f-body); padding: 2px 8px; border-radius: 99px; }
.tag.r { background: var(--bad-soft); color: var(--bad); } .tag.a { background: var(--warn-soft); color: var(--warn); } .tag.g { background: var(--ok-soft); color: var(--ok); }
.missing button { background: none; border: 0; padding: 9px 8px; min-height: 40px; color: var(--ink); text-align: left; font-size: 13.5px; flex: 1; min-width: 0; }
.missing button:hover { color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px; }
.side .missing button { padding-block: 6px; min-height: 34px; } /* desktop side panel only; on the Review step these stay 40 px tap targets */
.moreline { font-size: 12.5px; color: var(--muted); padding-left: 8px; }
.brief { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); padding: 18px 18px 8px; overflow-x: auto; }
.brief h3 { font-size: 17px; margin: 16px 0 6px; }
.brief h3:first-child { margin-top: 0; }
.brief dl { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0, 1fr); gap: 4px 14px; margin: 0 0 6px; font-size: 14px; }
.brief dt { color: var(--muted); }
.brief dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 600px) { .brief dl { grid-template-columns: 1fr; gap: 0; } .brief dt { font: 500 12px var(--f-body); margin-top: 8px; } }
.brief table { border-collapse: collapse; font-size: 13.5px; width: 100%; margin-bottom: 8px; }
.brief th, .brief td { border-bottom: 1px solid var(--line); padding: 6px 8px 6px 0; text-align: left; vertical-align: top; }
.brief th { font: 500 12px var(--f-body); color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.toast { position: fixed; left: 16px; right: 16px; margin-inline: auto; width: fit-content; max-width: 560px; bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r-sm); font-size: 14px; line-height: 1.4; z-index: 20; pointer-events: none; box-shadow: var(--shadow-lg); }
.reopen { color: var(--warn); font-weight: 600; }

/* bottom bar */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px); }
.nav .wrap { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
.nav .where { font-size: 12.5px; color: var(--muted); text-align: center; }
.nav button { min-width: 0; gap: 0; white-space: pre; }
@media (max-width: 600px) { .nav .where, .nav .nl { display: none; } .nav .primary { flex: 1; } }

/* home */
.home { padding-block: 28px 120px; display: grid; gap: 28px; }
.hhead { display: flex; justify-content: space-between; gap: 16px 24px; align-items: end; flex-wrap: wrap; }
.hhead h1 { font-size: clamp(26px, 4vw, 30px); line-height: 1.15; }
.hhead p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.hcols { display: grid; gap: 24px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .hcols { grid-template-columns: minmax(0, 1fr) 320px; } }
.hside { display: grid; gap: 16px; }
.hcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.hcard h2 { font-size: 15px; }
.saved { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.saved > p { margin: 0; padding: 28px 20px; text-align: center; }
.hcard .saved { border: 0; box-shadow: none; border-radius: 0; background: transparent; }
.svrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding-right: 12px; }
.saved > .svrow + .svrow { border-top: 1px solid var(--line); }
.hcard .svrow { padding: 0; }
.hcard .svrow + .svrow { border-top: 1px solid var(--line); }
.sv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border: 0; background: transparent; text-align: left; min-width: 0; }

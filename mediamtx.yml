# MediaMTX configuration for EA-SYS live streaming
# RTMP ingest from Zoom → HLS output for browser playback

# Logs: stdout (docker logs) AND a file the CloudWatch agent ships to the
# ea-sys/mediamtx group (Nov 5, 2026). The app only sees that a stream
# vanished; why (Zoom closed it, a timeout) is only in these lines, e.g.
# "[RTMP] [conn 1.2.3.4:5678] closed: <reason>". /logs is the box's
# ./logs folder (docker-compose.prod.yml); rotated by
# infra/cloudwatch/mediamtx.logrotate.
logLevel: info
logDestinations: [stdout, file]
logFile: /logs/mediamtx.log

# Only RTMP in (Zoom) and HLS out (viewers). RTSP, WebRTC and SRT are off
# (Nov 5, 2026 security review): each was a listener nobody used, and WebRTC
# and SRT also accept publishes, so each was a second door into live/<key>.
rtmp: yes
rtmpAddress: :1935
hls: yes
hlsAddress: :8888
rtsp: no
webrtc: no
srt: no

# Publish authorisation (Nov 5, 2026 security review, W-03). Every viewer's
# HLS URL contains the stream key, so without this anyone registered could
# push their own video to rtmp://<host>:1935/live/<key> and replace the
# webinar. MediaMTX asks the app before each publish; the app allows it only
# with the HMAC password Zoom is given (src/app/api/webhooks/mediamtx-auth,
# docs/LIVE_STREAMING.md §11a). Reads are excluded so viewers never reach the
# app. A webinar set up before Oct 2, 2026 needs "Re-send stream settings to
# Zoom" once, or its publish is refused.
authMethod: http
authHTTPAddress: https://events.meetingmindsgroup.com/api/webhooks/mediamtx-auth
authHTTPExclude:
  - action: read
  - action: playback

# HLS settings — mpegts variant (fmp4 has known 404 issues)
hlsVariant: mpegts
hlsSegmentCount: 7
# 4s, not 2s (Nov 5, 2026): a piece can only be cut at a keyframe, and Zoom
# sends one every ~3s (more on static slides). At 2s MediaMTX had to stretch
# the pieces mid-stream ("segment duration changed from 2s to 3s - this will
# cause an error in iOS clients"), which freezes iPhone/iPad playback until
# the page is reopened. Keep it at or above Zoom's keyframe gap. The player's
# BEHIND_LIVE_THRESHOLD_S / LIVE_EDGE_OFFSET_S assume this value.
hlsSegmentDuration: 4s
hlsSegmentMaxSize: 50M
hlsAlwaysRemux: true

# Allow all paths
paths:
  all:
    source: publisher

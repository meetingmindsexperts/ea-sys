# MediaMTX configuration for EA-SYS live streaming
# RTMP ingest from Zoom → HLS output for browser playback

# Logs: stdout (docker logs) AND a file the CloudWatch agent ships to the
# ea-sys/mediamtx group (Nov 5, 2026). The app only sees that a stream
# vanished; why (Zoom closed it, a timeout) is only in these lines, e.g.
# "[RTMP] [conn 1.2.3.4:5678] closed: <reason>". /logs is the box's
# ./logs folder (docker-compose.prod.yml); rotated by
# infra/cloudwatch/mediamtx.logrotate.
logLevel: info
logDestinations: [stdout, file]
logFile: /logs/mediamtx.log

# Only RTMP in (Zoom) and HLS out (viewers). RTSP, WebRTC and SRT are off
# (Nov 5, 2026 security review): each was a listener nobody used, and WebRTC
# and SRT also accept publishes, so each was a second door into live/<key>.
rtmp: yes
rtmpAddress: :1935
hls: yes
hlsAddress: :8888
rtsp: no
webrtc: no
srt: no

# Publish authorisation (Nov 5, 2026 security review, W-03). Every viewer's
# HLS URL contains the stream key, so without this anyone registered could
# push their own video to rtmp://<host>:1935/live/<key> and replace the
# webinar. MediaMTX asks the app before each publish; the app allows it only
# with the HMAC password Zoom is given (src/app/api/webhooks/mediamtx-auth,
# docs/LIVE_STREAMING.md §11a). Reads are excluded so viewers never reach the
# app. A webinar set up before Oct 2, 2026 needs "Re-send stream settings to
# Zoom" once, or its publish is refused.
authMethod: http
authHTTPAddress: https://events.meetingmindsgroup.com/api/webhooks/mediamtx-auth
authHTTPExclude:
  - action: read
  - action: playback

# Control API (Nov 12, 2026): lets the app see who is publishing and disconnect
# a publisher, which is the only way to end a PARTNER's stream (their platform
# is not ours to tell to stop; src/lib/webinar/mediamtx-control.ts). Reached
# only inside the box's container network: docker-compose.prod.yml never
# publishes 9997. It has no password of its own. `api` is deliberately NOT in
# authHTTPExclude above, so every API call is put to the app's webhook like a
# publish is, and the webhook allows it only with MEDIAMTX_API_SECRET. Do not
# add `action: api` to that list: the API can also rewrite this server's
# configuration, and it would then answer anyone who can reach the port.
# Takes effect at the next MediaMTX recreate (docs/LIVE_STREAMING.md, 11b).
api: yes
apiAddress: :9997

# HLS settings — mpegts variant (fmp4 has known 404 issues)
hlsVariant: mpegts
hlsSegmentCount: 7
# 4s, not 2s (Nov 5, 2026): a piece can only be cut at a keyframe, and Zoom
# sends one every ~3s (more on static slides). At 2s MediaMTX had to stretch
# the pieces mid-stream ("segment duration changed from 2s to 3s - this will
# cause an error in iOS clients"), which freezes iPhone/iPad playback until
# the page is reopened. Keep it at or above Zoom's keyframe gap. The player's
# BEHIND_LIVE_THRESHOLD_S / LIVE_EDGE_OFFSET_S assume this value.
hlsSegmentDuration: 4s
hlsSegmentMaxSize: 50M
hlsAlwaysRemux: true

# Allow all paths
# Recording a partner's stream (Nov 24, 2026; docs/PARTNER_STREAM_RECORDING_PLAN.md).
# Off for every stream. Our app switches it on for ONE stream at a time, through
# the control API, with a setting that carries `record` and nothing else.
#
# These defaults MUST live here, in pathDefaults, and never under `paths: all:`
# below. A setting made through the API is built from pathDefaults, and MediaMTX
# keeps a live sender connected through a settings change only when nothing but
# recording fields differ from the setting the stream is on. A test reads this
# file (mediamtx-control-recording.test.ts) and fails if `all` gains anything.
#
# Pieces of at least 6 seconds (cut at the next keyframe), named by their start
# in Unix time so no clock zone is assumed, in /recordings (mounted from the
# box's ./recordings, read-only in the worker). The worker ships each piece to
# S3 and then asks MediaMTX to delete it; recordDeleteAfter is only the backstop
# for a piece nobody shipped. All of it was run on a throwaway 1.17.1 first.
pathDefaults:
  record: no
  recordPath: /recordings/%path/%s-%f
  recordFormat: mpegts
  recordSegmentDuration: 6s
  recordDeleteAfter: 2h

paths:
  all:
    source: publisher

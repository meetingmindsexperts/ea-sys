services:
  ea-sys-blue:
    # Pre-built image from ECR (deploy.sh sets EA_SYS_WEB_IMAGE to :<sha>).
    # `build:` is kept as the on-box fallback: `docker compose build` still works
    # and tags the result as this image, so a deploy survives ECR being down.
    image: ${EA_SYS_WEB_IMAGE:-803726282629.dkr.ecr.ap-south-1.amazonaws.com/ea-sys:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Only used on the on-box fallback build (ECR unreachable). The normal
        # path pulls an image CI already built WITH these baked in.
        GIT_SHA: ${IMAGE_TAG:-unknown}
    container_name: ea-sys-blue
    labels:
      ea_sys_service: blue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - EA_SYS_SLOT=blue
      - MEDIAMTX_HLS_URL=http://ea-sys-mediamtx:8888
      # MediaMTX's control API, on the container network only (never published): who is
      # publishing, and disconnecting a partner's stream. Needs MEDIAMTX_API_SECRET in .env.
      - MEDIAMTX_API_URL=http://ea-sys-mediamtx:9997
    ports:
      - "3000:3000"
    # Steady state is ~230 MB. The cap exists to stop a runaway from taking the
    # whole box down (INC-001), not to run the app close to a ceiling.
    #
    # 3500m, not 2600m: badge "Print All" renders up to 2500 barcodes via
    # pdfkit/bwip-js, and those are OFF-HEAP Buffers — they do not count against
    # the 2 GB V8 heap cap in NODE_OPTIONS, so RSS can climb past it on a big
    # print. Getting OOM-killed mid-print at a live door would be a worse bug than
    # the one we are preventing. Ceilings are not reservations; the headroom costs
    # nothing until something misbehaves.
    mem_limit: 3500m
    memswap_limit: 4500m
    healthcheck:
      # NOTE: this does NOT self-heal. Docker Compose does not restart a container
      # just because it goes unhealthy (only Swarm does); `restart: unless-stopped`
      # fires when the process EXITS. This is VISIBILITY — `docker ps` shows
      # "unhealthy" instead of "Up", which is what you want when a Node process is
      # wedged-but-alive (event-loop stall, pool exhaustion) rather than crashed.
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - web
    volumes:
      # Shared uploads directory — both slots mount the same path
      - ./public/uploads:/app/public/uploads
      # Shared log directory for file-based log reading
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.Name}}/{{.ID}}"
        # Copies the ea_sys_service label into every json-file line ("attrs"),
        # which is how the CloudWatch agent's ea-sys/docker group tells blue,
        # green and the worker apart (W0-3). MediaMTX ships its own log file.
        labels: "ea_sys_service"

  ea-sys-green:
    image: ${EA_SYS_WEB_IMAGE:-803726282629.dkr.ecr.ap-south-1.amazonaws.com/ea-sys:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${IMAGE_TAG:-unknown}
    container_name: ea-sys-green
    labels:
      ea_sys_service: green
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - EA_SYS_SLOT=green
      - MEDIAMTX_HLS_URL=http://ea-sys-mediamtx:8888
      # MediaMTX's control API, on the container network only (never published): who is
      # publishing, and disconnecting a partner's stream. Needs MEDIAMTX_API_SECRET in .env.
      - MEDIAMTX_API_URL=http://ea-sys-mediamtx:9997
    ports:
      - "3001:3000"
    # Steady state is ~230 MB. The cap exists to stop a runaway from taking the
    # whole box down (INC-001), not to run the app close to a ceiling.
    #
    # 3500m, not 2600m: badge "Print All" renders up to 2500 barcodes via
    # pdfkit/bwip-js, and those are OFF-HEAP Buffers — they do not count against
    # the 2 GB V8 heap cap in NODE_OPTIONS, so RSS can climb past it on a big
    # print. Getting OOM-killed mid-print at a live door would be a worse bug than
    # the one we are preventing. Ceilings are not reservations; the headroom costs
    # nothing until something misbehaves.
    mem_limit: 3500m
    memswap_limit: 4500m
    healthcheck:
      # NOTE: this does NOT self-heal. Docker Compose does not restart a container
      # just because it goes unhealthy (only Swarm does); `restart: unless-stopped`
      # fires when the process EXITS. This is VISIBILITY — `docker ps` shows
      # "unhealthy" instead of "Up", which is what you want when a Node process is
      # wedged-but-alive (event-loop stall, pool exhaustion) rather than crashed.
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - web
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.Name}}/{{.ID}}"
        # Copies the ea_sys_service label into every json-file line ("attrs"),
        # which is how the CloudWatch agent's ea-sys/docker group tells blue,
        # green and the worker apart (W0-3). MediaMTX ships its own log file.
        labels: "ea_sys_service"

  # ── Background worker tier ───────────────────────────────────────────────────
  # Runs the 5 cron-driven jobs (cert renderer, scheduled emails, webinar
  # recordings + attendance, MCP OAuth cleanup) on a node-cron scheduler in
  # its own process. Sibling of the blue/green web containers; shares the
  # same .env, same uploads volume, same logs volume, same network so it
  # can reach Postgres through the same connection string. See
  # docs/WORKER_EXTRACTION_PLAN.md for the architecture.
  #
  # Phase 2 (dual-write window): both the legacy /api/cron/* routes AND
  # this worker run the same shared runTick() functions. Postgres advisory
  # locks (worker/lib/advisory-lock.ts) serialize them so we never
  # double-process a row.
  #
  # Healthcheck hits localhost:3099/health inside the container — no port
  # is published externally, the endpoint is for Docker only.
  ea-sys-worker:
    # Pre-built worker image from ECR (deploy.sh sets EA_SYS_WORKER_IMAGE to
    # :worker-<sha>). This image also runs `prisma migrate deploy` during deploy
    # (it ships the full node_modules incl. the Prisma CLI). `build:` kept as the
    # on-box fallback.
    image: ${EA_SYS_WORKER_IMAGE:-803726282629.dkr.ecr.ap-south-1.amazonaws.com/ea-sys:worker-latest}
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        GIT_SHA: ${IMAGE_TAG:-unknown}
    container_name: ea-sys-worker
    labels:
      ea_sys_service: worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - WORKER_HEALTH_PORT=3099
      # The webinar overrun checks (room auto-close, thank-you hold) probe the
      # stream from here. Without it the probe falls back to the worker's own
      # localhost and always says "not streaming" (Nov 5, 2026).
      - MEDIAMTX_HLS_URL=http://ea-sys-mediamtx:8888
      # MediaMTX's control API, on the container network only (never published): who is
      # publishing, and disconnecting a partner's stream. Needs MEDIAMTX_API_SECRET in .env.
      - MEDIAMTX_API_URL=http://ea-sys-mediamtx:9997
      # ── The worker MUST use a SESSION-mode connection, not the pooler ──────
      # Every job is wrapped in a Postgres advisory lock so a job can never run
      # twice concurrently. Advisory locks are SESSION-scoped: the same backend
      # that takes the lock must be the one that releases it.
      #
      # The pooled DATABASE_URL (:6543, pgbouncer=true) is TRANSACTION-pooled —
      # each statement can land on a different backend. So the worker took the
      # lock on backend A, and the unlock ran on backend B, which never held it.
      # The lock stayed stuck on A until pgbouncer recycled that connection
      # minutes later, and EVERY tick in between skipped.
      #
      # Measured on prod before this fix (2026-08-10, 24h): scheduled-emails ran
      # 435 times out of an expected 1,440; cert-issue 182 of 480. Scattered
      # gaps up to 17 minutes, all exact multiples of the cadence, with zero
      # connection errors — i.e. the cron fired and the work was skipped. This
      # is the "P3" limitation documented in worker/lib/advisory-lock.ts, which
      # was believed to be latent (it needs two workers to cause DUPLICATE work)
      # but with one worker still causes SKIPPED work.
      #
      # DIRECT_URL is :5432 session mode — one backend per connection, so
      # lock/unlock pair correctly. Required, not defaulted: a silent fallback
      # to the pooler is the exact failure this line exists to prevent.
      #
      # Pool kept at 10 — the SAME value the worker has run on since the June
      # 2026 P2024 incident, when 3 was too few and jobs ticking on the same
      # minute boundary exhausted the pool. Direct connections are scarcer than
      # pooled ones so the instinct is to shrink it here, but the measurement
      # says otherwise: prod is at 24 of max_connections=90, so 10 direct
      # connections lands around 34 — ample. Halving a number that is only
      # known-good at 10 would have traded a fixed bug for a reintroduced one.
      # The web containers deliberately KEEP the pooler — many short requests is
      # exactly what it is for, and Supavisor multiplexes both slots down to
      # ~11 real backends regardless of their client-side limit.
      - DATABASE_URL=${DIRECT_URL:?DIRECT_URL is required — the worker needs a session-mode connection for advisory locks}?connection_limit=10&pool_timeout=15
    # Same reasoning as the web slots. The worker renders PDFs and pulls Zoom
    # reports, so its peaks are spikier — but it must not be able to take the
    # host down with it.
    mem_limit: 2600m
    memswap_limit: 3600m
    networks:
      - web
    volumes:
      # Same uploads mount as the web containers — the cert renderer
      # reads template background PDFs from public/uploads/certificates/
      # and writes issued PDFs back to the same tree. The mount must
      # match the web containers exactly or PDFs end up in two
      # different "public/uploads/" directories that don't sync.
      - ./public/uploads:/app/public/uploads
      # Shared log directory so the file logger has a writable target
      # AND the existing /logs viewer can read worker output.
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3099/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.Name}}/{{.ID}}"
        # Copies the ea_sys_service label into every json-file line ("attrs"),
        # which is how the CloudWatch agent's ea-sys/docker group tells blue,
        # green and the worker apart (W0-3). MediaMTX ships its own log file.
        labels: "ea_sys_service"

  # ── RTMP → HLS live streaming server ─────────────────────────────────────────
  mediamtx:
    # Pinned (Nov 5, 2026) to the version the box was running: `latest` would let a
    # future MediaMTX that renames a config key break the next restart mid-season.
    # The config keys in mediamtx.yml (logDestinations, logFile, hls*) are 1.17's.
    # Upgrade deliberately: change this, recreate outside a webinar, check the log.
    image: bluenviron/mediamtx:1.17.1
    container_name: ea-sys-mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"    # RTMP ingest (Zoom pushes here)
      # HLS output, localhost only: nginx proxies /stream/ to it and the worker
      # reaches it by container name, so nothing outside the box needs it
      # (Nov 5, 2026 security review). WebRTC (8889) is off in mediamtx.yml.
      - "127.0.0.1:8888:8888"
      # 9997, the control API, is deliberately NOT here: the app and the worker reach it
      # by container name (MEDIAMTX_API_URL). Published, it would let anyone who can reach
      # the box try the API's password against our webhook (Nov 12, 2026).
    # Idles at ~11 MB; a live stream is the only thing that moves it. Capped so a
    # misbehaving ingest can't compete with the app for host memory.
    mem_limit: 512m
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
      # Its log file, beside app.log, for the CloudWatch agent (mediamtx.yml logFile).
      - ./logs:/logs
      # The box's trusted certificate authorities, read-only. The image has none,
      # so the publish check's HTTPS call to /api/webhooks/mediamtx-auth failed
      # "x509: certificate signed by unknown authority" and EVERY publish was
      # refused, Zoom's included (found by the wrong-key test, Nov 5, 2026).
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  web:
    driver: bridge

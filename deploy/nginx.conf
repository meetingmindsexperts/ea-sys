# ─────────────────────────────────────────────────────────────────────────────
# THE nginx site config for events.meetingmindsgroup.com. There is exactly one.
#
# This file is a byte-for-byte copy of the LIVE file on the production box,
# /etc/nginx/sites-available/ea-sys (last verified identical 2026-09-24).
# Everything that installs nginx reads it: deploy/setup.sh, infra/dr/user-data.sh
# (the Singapore DR bootstrap) and docs/FROM_SCRATCH_REBUILD.md.
#
# Until 24 Sep 2026 there were two: this path held an old template that had
# drifted from the box, and the real config lived in nginx.live-snapshot.conf.
# The setup script and the DR bootstrap installed the TEMPLATE, so a rebuilt
# or failed-over server would have come up without the rate limits, the
# maintenance page and the MCP streaming settings.
#
# THE BOX IS WHERE CHANGES HAPPEN. Certbot rewrites the live file, so:
#   1. change the live file on the box, `sudo nginx -t`, `sudo systemctl reload nginx`
#   2. `npm run nginx:drift` (read-only) to see the box differ from this file
#   3. copy the change here and commit it, so the next rebuild gets it
# Full procedure and history: deploy/NGINX.md. The upstream (blue/green port)
# is NOT here: scripts/deploy.sh writes /etc/nginx/conf.d/ea-sys-upstream.conf.
# The comments below this header are the live file's own.
# ─────────────────────────────────────────────────────────────────────────────

# ── Rate limiting (origin directly exposed, no CDN — $remote_addr is the real
#    client IP). Crude-flood backstop; tuned to tolerate shared-NAT event
#    crowds. Raise limit_conn / rate for very large on-site audiences. ───────
limit_req_zone  $binary_remote_addr zone=ea_req:10m  rate=100r/s;
limit_conn_zone $binary_remote_addr zone=ea_conn:10m;
limit_req_status   429;
limit_conn_status  429;
limit_req_log_level warn;

# ── Maintenance page (repo: deploy/maintenance/) ─────────────────────────────
# Stop advertising the nginx version on error pages and in the Server header.
server_tokens off;

# Which error page a request gets, keyed on the path, so an API client is
# answered in the format it asked for rather than an HTML blob it cannot parse.
map $uri $ea_maintenance_page {
    default  /maintenance.html;
    ~^/api/  /maintenance.json;
}

server {
    server_name events.meetingmindsgroup.com;

    # Concurrent connections per IP (shared-NAT-tolerant; raise for big venues).
    limit_conn ea_conn 100;
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_min_length    1024;
    gzip_types         text/plain text/css text/csv text/xml text/javascript text/x-component
                       application/javascript application/json application/manifest+json
                       application/xml image/svg+xml;

    # MCP endpoint — disable gzip + buffering for SSE streaming
    location /api/mcp {
        limit_req zone=ea_req burst=50 nodelay;

        proxy_pass         http://ea_sys_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        gzip               off;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        limit_req zone=ea_req burst=200 nodelay;

        proxy_pass         http://ea_sys_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Live HLS stream — intentionally NOT rate-limited (players poll segments).
    location /stream/ {
        proxy_pass http://localhost:8888/;
        proxy_http_version 1.1;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
    }


    # Upstream unreachable (crash, deploy, stopped instance) -> a page nginx
    # serves from disk, needing no application to render. =503 rewrites 502/504
    # to the honest code: a 200 here would tell crawlers the page is genuinely
    # this content, and tell uptime monitoring the site is healthy while down.
    error_page 502 503 504 =503 $ea_maintenance_page;

    location = /maintenance.html {
        root /var/www/maintenance;
        internal;
        add_header Retry-After 600 always;
        add_header Cache-Control "no-store" always;
    }

    location = /maintenance.json {
        root /var/www/maintenance;
        internal;
        default_type application/json;
        add_header Retry-After 600 always;
        add_header Cache-Control "no-store" always;
    }

    # TEMPORARY, verification only. Port 9 is discard, so the connection is
    # refused and nginx produces the 502 that triggers error_page above.
    # REMOVE THIS AND RELOAD once verified.

    client_max_body_size 10M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/events.meetingmindsgroup.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/events.meetingmindsgroup.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = events.meetingmindsgroup.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name events.meetingmindsgroup.com;
    return 404; # managed by Certbot
}
